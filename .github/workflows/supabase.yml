# Deploys the backend to the production Supabase project: schema + data migrations, edge functions,
# the Gemini key, and the auth redirect URLs for the GitHub Pages site. Runs from GitHub, so it can be
# started from a phone (Actions -> supabase -> Run workflow).
#
# Repo settings -> Secrets and variables -> Actions:
#   variable SUPABASE_PROJECT_REF   (the xxxx of supabase.com/dashboard/project/xxxx)
#   secret   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   secret   SUPABASE_DB_PASSWORD   (chosen when creating the project)
#   secret   GEMINI_API_KEY         (aistudio.google.com/apikey)
name: supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/templates/**', '.github/workflows/supabase.yml']
concurrency: { group: supabase, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Check settings
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD REF; do [ -n "${!v}" ] || { echo "::error::$v is not set (see the top of this file)"; exit 1; }; done
      - run: supabase link --project-ref "$REF"
      - run: supabase db push --include-all
      - run: supabase functions deploy --project-ref "$REF"
      - name: Gemini key for scan-photo
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY is not set"; exit 1; }
          supabase secrets set --project-ref "$REF" GEMINI_API_KEY="$GEMINI_API_KEY" AI_PROVIDER=gemini
      - name: Auth -> Pages site URL, emails with the sign-in code
        run: |
          jq -n --arg url "$SITE_URL" --rawfile tpl supabase/templates/code.html '{
            site_url: $url, uri_allow_list: $url,
            mailer_subjects_magic_link: "Ton code de connexion", mailer_templates_magic_link_content: $tpl,
            mailer_subjects_confirmation: "Ton code de connexion", mailer_templates_confirmation_content: $tpl
          }' > auth.json
          curl -sSf -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @auth.json > /dev/null
          echo "Site URL set to $SITE_URL, code email templates applied"
